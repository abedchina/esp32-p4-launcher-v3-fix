  - Conv
  - Gemm
  - MatMul
  - Add
  - Sub
  - Mul
  - Div
  - Relu
  - LeakyRelu
  - PRelu
  - Sigmoid
  - Tanh
  - HardSigmoid
  - HardSwish
  - LUT
  - Clip
  - Swish
  - Exp
  - Sqrt
  - Resize
  - GlobalAveragePool
  - AveragePool
  - MaxPool
  - Pad
  - Transpose
  - ReduceMean
  - ReduceMax
  - QuantizeLinear
